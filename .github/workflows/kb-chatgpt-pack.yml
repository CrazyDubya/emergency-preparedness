name: Pack ChatGPT knowledge-bottleneck artifacts

on:
  push:
    branches: [experiment/kb-chatgpt-held]
    paths:
      - experiments/knowledge-bottleneck/submissions/chatgpt-sol/build_artifacts.py

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/kb-chatgpt-held
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pack artifacts to byte ceilings
        run: python experiments/knowledge-bottleneck/submissions/chatgpt-sol/build_artifacts.py
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('experiments/knowledge-bottleneck/submissions/chatgpt-sol')
          limits={'1k.txt':1024,'100k.txt':102400,'1m.txt':1048576}
          for n,lim in limits.items():
              b=(root/n).read_bytes()
              print(n,len(b),f'{len(b)/lim:.1%}')
              assert len(b)<=lim
              b.decode('utf-8')
          PY
          git config user.name 'knowledge-bottleneck-packer'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/knowledge-bottleneck/submissions/chatgpt-sol/100k.txt experiments/knowledge-bottleneck/submissions/chatgpt-sol/1m.txt
          git diff --cached --quiet || git commit -m 'Pack ChatGPT blind artifacts to constrained budgets [skip ci]'
          git push origin HEAD:experiment/kb-chatgpt-held
